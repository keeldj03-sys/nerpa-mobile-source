  "release_signing": {
    "_comment": "Digest of the operator's release certificate — the only signing value that lives in this tree and in the public mirror. The keystore itself is on the operator's machine outside the repository and is never committed; its path, alias and passphrase are not recorded here or anywhere in the fork's documents. tool/build-release.sh reads this digest before Gradle starts and renames every release APK whose signing certificate does not match it to *.apk.rejected. Losing this key means every recipient must reinstall, so it is backed up offline and has no second copy.",
    "certificate_sha256": "25f113ebabb025a757a3c7024337a8a2a3f238d5e9c5dda1fc4b65f9c80c89d2",
    "key": "RSA 2048, SHA256withRSA, PKCS12",
    "validity": "created 2026-11-04, expires 2051-10-29",
    "application_id": {
      "playstore": "ru.nerpa.mobile",
      "fdroid": "ru.nerpa.mobile.fdroid"
    },
    "_how_pinned": "Снято 2026-11-04 с публичной части ключа: keytool -exportcert выписывает сертификат в DER, и SHA-256 этого файла совпадает со значением, которое keytool печатает как свой SHA256 fingerprint. Формат сверки проверен на одноразовом ключе: apksigner verify --print-certs выдаёт дайджест ровно в той же записи, что и keytool, — именно на неё смотрит tool/build-release.sh. До первой настоящей сборки этот ключ ещё не встречался: проверка на реальном APK — следующий шаг, и если она разойдётся, правится пин, а не артефакт."
  }
